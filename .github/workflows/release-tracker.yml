name: Kubernetes Release Tracker

on:
  # Manual trigger
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  analyze-release:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run Kubernetes release analysis
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        QIANFAN_TOKEN: ${{ secrets.QIANFAN_TOKEN }}
        RULIU_ACCESS_TOKEN: ${{ secrets.RULIU_ACCESS_TOKEN }}
        RULIU_TARGET_IDS: ${{ secrets.RULIU_TARGET_IDS }}
      run: |
        echo "🚀 Running Kubernetes release analysis with prerelease support..."
        mkdir -p reports
        python main.py analyze --include-prerelease
    
    - name: Get latest report info
      if: always()
      id: report-info
      run: |
        if [ -d "reports" ] && [ "$(ls -A reports)" ]; then
          # Get the latest report file for naming
          LATEST_REPORT=$(ls -t reports/*.md 2>/dev/null | head -1)
          if [ -n "$LATEST_REPORT" ]; then
            REPORT_NAME=$(basename "$LATEST_REPORT" .md)
            echo "report_name=$REPORT_NAME" >> $GITHUB_OUTPUT
            echo "has_reports=true" >> $GITHUB_OUTPUT

            # List all generated files
            FILES=$(ls reports/*.md reports/*.json 2>/dev/null | sed 's|^reports/|- `reports/|; s|$|`|')
            echo "files<<EOF" >> $GITHUB_OUTPUT
            echo "$FILES" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "has_reports=false" >> $GITHUB_OUTPUT
          fi
        else
          echo "has_reports=false" >> $GITHUB_OUTPUT
        fi

    - name: Create Pull Request
      if: always() && steps.report-info.outputs.has_reports == 'true'
      id: create-pr
      uses: peter-evans/create-pull-request@v6
      with:
        token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
        commit-message: "Add Kubernetes release analysis: ${{ steps.report-info.outputs.report_name }}"
        title: "📊 Kubernetes Release Analysis: ${{ steps.report-info.outputs.report_name }}"
        body: |
          ## 🚀 Kubernetes Release Analysis Report

          This PR contains the automated analysis results for the latest Kubernetes release.

          ### 📁 Generated Files
          ${{ steps.report-info.outputs.files }}

          ### 📋 Analysis Details
          - **Prerelease included**: Yes
          - **Generated at**: ${{ github.event.head_commit.timestamp || github.run_id }}
          - **Workflow run**: [View logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

          ### 🔍 Review Instructions
          1. Review the generated Markdown report for human-readable analysis
          2. Check the JSON file for structured data
          3. Verify the analysis quality and completeness
          4. Merge when satisfied with the results

          ---
          *🤖 This PR was automatically generated by the Kubernetes Release Tracker*
        branch: kubernetes-analysis/${{ steps.report-info.outputs.report_name }}
        delete-branch: true
        draft: false

    - name: Upload reports as artifacts (backup)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: kubernetes-release-reports
        path: reports/
        retention-days: 30
    
    - name: Log completion
      if: always()
      run: |
        if [ "${{ job.status }}" = "success" ]; then
          echo "✅ Kubernetes release analysis completed successfully!"
          if [ -n "${{ steps.create-pr.outputs.pull-request-url }}" ]; then
            echo "📋 Pull Request created: ${{ steps.create-pr.outputs.pull-request-url }}"
          fi
        else
          echo "❌ Kubernetes release analysis failed. Check the logs above for details."
        fi

